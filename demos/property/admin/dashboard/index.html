    <!-- GitHub Pages SPA Route Recovery -->
    <script>
      (function (location) {
        if (!location.search.startsWith('?/')) {
          return;
        }

        const decodedRoute = location.search
          .slice(2)
          .split('&')
          .map(function (segment) {
            return segment.replace(/~and~/g, '&');
          });

        const routePath = decodedRoute.shift() || '';
        const queryString = decodedRoute.length
          ? '?' + decodedRoute.join('&')
          : '';

        window.history.replaceState(
          null,
          '',
          '/' + routePath + queryString + location.hash
        );
      })(window.location);
    </script>
